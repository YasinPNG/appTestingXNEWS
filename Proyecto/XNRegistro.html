<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleRegistro.css">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">
        <title>X-News Registro</title>
    </head>
    <body>
    <div class="phone">
        <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">
            <div class="container">
                <div class="logo">
                    <img src="SVG/logoXN.svg" alt="X-NEWS">
                </div>

                <div class="register-container">
                    <form id="registroForm">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                        <small id="usuario-error" class="error-msg"></small>

                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                        <small id="correo-error" class="error-msg"></small>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                        <small id="password-error" class="error-msg"></small>

                        <label for="password2">Reingrese Contraseña</label>
                        <input type="password" id="password2" placeholder="Repite tu contraseña" required>
                        <small id="password2-error" class="error-msg"></small>

                        <button type="submit">ENVIAR</button>
                    </form>

                    <div class="separator">También puedes usar</div>

                    <button class="google-btn">
                        <img src="IMG/google.png" alt="Google"> Registrarse con Google
                    </button>
                </div>
            </div>
        </div>  

        <script>
        const form = document.querySelector("#registroForm");

        form.addEventListener("submit", function(event) {
            let valido = true;

            // Usuario vacío
            const usuario = document.getElementById("usuario");
            const usuarioError = document.getElementById("usuario-error");
            if (usuario.value.trim() === "") {
                usuarioError.textContent = "Debes ingresar tu usuario.";
                usuarioError.style.display = "block";
                usuario.classList.add("error");
                valido = false;
            } else {
                usuarioError.style.display = "none";
                usuario.classList.remove("error");
            }

            
            const correo = document.getElementById("correo");
            const correoError = document.getElementById("correo-error");
            if (correo.value.trim() === "") {
                correoError.textContent = "Debes ingresar tu correo.";
                correoError.style.display = "block";
                correo.classList.add("error");
                valido = false;
            } else {
                correoError.style.display = "none";
                correo.classList.remove("error");
            }

            
            const pass1 = document.getElementById("password").value;
            const pass2 = document.getElementById("password2").value;
            const pass2Error = document.getElementById("password2-error");

            if (pass1 !== pass2) {
                pass2Error.textContent = "Las contraseñas no coinciden.";
                pass2Error.style.display = "block";
                valido = false;
            } else {
                pass2Error.style.display = "none";
            }

            
            if (!valido) {
                event.preventDefault();
            }
        });
        </script>
    </body>

</html>
