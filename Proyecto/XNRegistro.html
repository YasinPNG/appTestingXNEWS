<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleRegistro.css">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">
        <title>X-News Registro</title>
    </head>
    <body>
    <div class="phone">
        <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">
            <div class="container">
                <div class="logo">
                    <img src="SVG/logoXN.svg" alt="X-NEWS">
                </div>

                <div class="register-container">
                    <form>
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

                        <label for="password2">Reingrese Contraseña</label>
                        <input type="password" id="password2" placeholder="Repite tu contraseña" required>

                        <button type="submit">ENVIAR</button>
                    </form>

                    <div class="separator">También puedes usar</div>

                    <button class="google-btn">
                        <img src="IMG/google.png" alt="Google"> Registrarse con Google
                    </button>
                </div>
            </div>
        </div>  
    </body>

</html>
