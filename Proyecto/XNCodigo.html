<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleCodigo.css">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">
        <title>X-News Codigo</title>
    </head>
    <body>
        <div class="phone">
            <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">
        <div class="container">

            <div class="code-container">
                <form action="XNConfirmacion.html" method="post">
                    <label for="codigo1">Código</label>
                    <div class="code-inputs">
                        <input type="text" id="codigo1" maxlength="1" required>
                        <input type="text" id="codigo2" maxlength="1" required>
                        <input type="text" id="codigo3" maxlength="1" required>
                        <input type="text" id="codigo4" maxlength="1" required>
                        <input type="text" id="codigo5" maxlength="1" required>
                        <input type="text" id="codigo6" maxlength="1" required>
                    </div>
                    <button type="submit">ENVIAR</button>
                </form>
            </div>
        </div>
        </div>
    </body>
</html>
