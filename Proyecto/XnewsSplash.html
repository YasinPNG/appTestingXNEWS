<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">

        <link rel="stylesheet" href="styleSplash.css">
        <link rel="stylesheet" href="principal.css">
        <title>X-News Splash</title>

    </head>
    <body>
        <div class="phone">
            <img src="IMG/FondoXnews_SP.jpg" class="background" alt="Fondo Splash">
                <div class="container">
                
                    <div id="space" class="space">
                        <div class="logo-block">
                            <img src="SVG/logo_arriba.svg" alt="Up" class="up">
                            <img src="SVG/logo_abajo.svg" alt="Down" class="down">
                        </div>

                        <img src="SVG/rojo.svg" alt="R" class="rojo">
                        <img src="SVG/verde.svg" alt="V" class="verde">
                        <img src="SVG/amarillo.svg" alt="Am" class="amarillo">
                        <img src="SVG/azul.svg" alt="Az" class="azul">

                        <img src="SVG/logo_nombre.svg" alt="Text" class="text">
                    </div>
                </div>
        </div>

        <<script>

            setTimeout(function() {
            
            document.getElementById("space").style.display = "none";

            
            window.location.href = "XNLogIn.html";
            }, 3000); 

            
        </script>
    </body>
</html>
