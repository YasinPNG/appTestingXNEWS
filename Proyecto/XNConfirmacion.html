<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleConfirmacion.css">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">
        <title>X-News Confirmación</title>
    </head>
    <body>
        <div class="phone">
            <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">

            <div class="container">
                
                <div class="logo">
                    <img src="SVG/logoXN.svg" alt="X-NEWS">
                    
                </div>

            
                <div class="confirm-container">
                    <form action="XNLogin.html" method="post">
                        <label for="password">Nueva Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu nueva contraseña" required>

                        <label for="password2">Confirmar Contraseña</label>
                        <input type="password" id="password2" placeholder="Repite tu contraseña" required>

                        <button type="submit">ENVIAR</button>
                    </form>
                </div>
            </div>
        </div> 
        
            <script>
                const form = document.querySelector("form");

                form.addEventListener("submit", function(event) {
                    const pass1 = document.getElementById("password").value;
                    const pass2 = document.getElementById("password2").value;

                    if (pass1 !== pass2) {
                        event.preventDefault(); 
                        alert("Las contraseñas no coinciden. Inténtalo de nuevo.");
                    }
                });
            </script>
    </body>
</html>
