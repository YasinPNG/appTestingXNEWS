<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleLogin.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>X-News LogIn</title>
    </head>

    <body>
       <div class="phone">
        <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">
            <div class="container">
                

                <div class="logo">
                    <img src="SVG/logoXN.svg" alt="X-NEWS">
                </div>

                <div class="login-container">

                    <form id="login-form">
                        <label for="usuario">Usuario/Correo Electrónico</label>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                        <small id="usuario-error" class="error-msg"></small>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                        <small id="password-error" class="error-msg"></small>

                        <div class="links">
                            <a href="XNRecuContra.html">¿No recuerdas tu contraseña?</a>
                            <a href="XNRegistro.html">Registrarse</a>
                        </div>

                        <button type="button" id="enviar-btn" >ENVIAR</button>
                    </form>


                    
                    <div class="separator">También puedes usar</div>

                    <button class="google-btn">
                        <img src="IMG/google.png" alt="Google"> Iniciar sesión con Google
                    </button>
                </div>
            </div>
                <div id="refresh-loader" class="hidden">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                        <p style="color:white; margin-top:10px;">Cargando...</p>
                </div>  
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const enviarBtn = document.getElementById("enviar-btn");
                const googleBtn = document.querySelector(".google-btn");
                const loader = document.getElementById("refresh-loader");
                const usuario = document.getElementById("usuario");
                const password = document.getElementById("password");
                const usuarioError = document.getElementById("usuario-error");
                const passwordError = document.getElementById("password-error");

                function showLoaderAndRedirect(url) {
                    loader.classList.remove("hidden"); 
                    setTimeout(() => {
                        window.location.href = url; 
                    }, 1000);
                }

                function validarCampos() {
                    let valido = true;

                    if (usuario.value.trim() === "") {
                        usuarioError.textContent = "Debes ingresar tu usuario.";
                        usuarioError.style.display = "block";
                        valido = false;
                    } else {
                        usuarioError.style.display = "none";
                    }

                    if (password.value.trim() === "") {
                        passwordError.textContent = "Debes ingresar tu contraseña.";
                        passwordError.style.display = "block";
                        valido = false;
                    } else {
                        passwordError.style.display = "none";
                    }

                    return valido;
                }

                enviarBtn.addEventListener("click", () => {
                    if (validarCampos()) {
                        showLoaderAndRedirect("XNHome.html");
                    }
                });

                googleBtn.addEventListener("click", () => {
                    if (validarCampos()) {
                        showLoaderAndRedirect("XNHome.html");
                    }
                });
            });
        </script>


    </body>
</html>
