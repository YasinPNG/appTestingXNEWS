<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="principal.css">
        <link rel="stylesheet" href="styleLogin.css">
        <meta name="viewport" content="width=device-width, initial-scale=1-0">
        <title>X-News LogIn</title>
    </head>
    <body>
       <div class="phone">
        <img src="IMG/FondoXnews.jpg" class="background"alt="Fondo Login">
            <div class="container">
                

                <div class="logo">
                    <img src="SVG/logoXN.svg" alt="X-NEWS">
                </div>

                <div class="login-container">

                    <form action="XNHome.html" method="post">
                        <label for="usuario">Usuario/Correo Electrónico</label>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

                        <div class="links">
                            <a href="RecuperarContra.html">¿No recuerdas tu contraseña?</a>
                            <a href="Registro.html">Registrarse</a>
                        </div>

                        <button type="submit">ENVIAR</button>
                    </form>

                    <!-- Google -->
                    <div class="separator">También puedes usar</div>

                    <button class="google-btn">
                        <img src="IMG/google.png" alt="Google"> Iniciar sesión con Google
                    </button>
                </div>
            </div>
        </div> 
    </body>
</html>
